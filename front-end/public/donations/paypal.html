<!DOCTYPE html>
<html lang="en" data-theme="retro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="assets/levinci-group-logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Donations</title>
  </head>
  <body class="min-h-screen flex items-center justify-center">
    <div class="container mx-auto">
      <h1 class="text-2xl font-bold text-center mb-6">
        Support Us with PayPal
      </h1>
      <p class="text-gray-600 text-center mb-8">
        Your support helps us keep our project going. Thank you for considering
        a donation!
      </p>

      <div class="flex justify-center">
        <div
          class="card flex flex-row bg-white card-compact bg-base-100 w-1/2 shadow-xl p-4"
        >
          <figure>
            <img
              class="h-48 object-cover rounded"
              src="assets/paypal.jpg"
              alt="Paypal Logo"
            />
          </figure>
          <div class="card-body w-1/2 ml-8">
            <h2 class="card-title text-xl font-semibold">
              Donation Information
            </h2>
            <p class="text-base mt-2">
              <strong>Email: </strong>
              <br />
              donation@yourdomain.com
              <br />
              <br />
              <strong>User: </strong> <br />Levinci Group
            </p>
          </div>
        </div>
      </div>
      <div class="flex justify-center mt-8">
        <button
          class="btn btn-neutral mx-auto"
          onclick="window.location.href='/'"
        >
          Back to home
        </button>
      </div>
    </div>
  </body>
</html>
