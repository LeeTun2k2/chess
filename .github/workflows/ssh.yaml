name: SSH into Remote Host

on:
  push:
    branches:
      - test

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install expect and ssh-client
        run: sudo apt-get install -y expect openssh-client

      - name: Run SSH Script
        run: |
          expect -c '
            spawn ssh -o StrictHostKeyChecking=no hcmute@103.130.211.150 -p 10038
            expect "hcmute@103.130.211.150's password:"
            send "hcmute@fit"
            interact && ls && ls && ls
          '

